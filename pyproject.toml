[tool.poetry]
name = "cloud-cost-slayer"
version = "0.1.0"
description = "Open-source AWS cost optimization CLI tool"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "cli"}]

[tool.poetry.dependencies]
python = "^3.10"
boto3 = "^1.34.0"
click = "^8.1.0"
rich = "^13.7.0"
pandas = "^2.1.0"
jinja2 = "^3.1.0"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"
matplotlib = "^3.8.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
moto = {extras = ["ec2", "cloudwatch"], version = "^5.0.0"}
black = "^24.1.0"
ruff = "^0.1.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
cloud-cost-slayer = "cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
